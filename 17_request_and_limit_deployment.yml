kind: Deployment
apiVersion: apps/v1
metadata:
  name: nginx-deploymeny
  namespace: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
    
  template:
    metadata:
      name: nginx-deployment-pod
      Labels:
        app: nginx
    spec:
      contianers:
      - name: nginx
        image: nginx:latest
        ports:
        - contianerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
          limits:
            cpu: 500m
            memory: 512Mi
            