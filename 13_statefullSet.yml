kind: statefullSet
apiVersion: apps/v1
metadata:
  name: mysql-statefullSet
  namespace: mysql

spec:
  serviceName: mysql-service
  replicas: 3
  selector:
    matchLabels:
      app: mysql
  
  template:
    metadata:
      name: mysql-pod
      Labels:
        app: mysql
      
      contianers:
      - name: mysql
        image: mysql:latest
        ports:
        - contianerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom: 
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_ROOT_PASSWORD

        - name: MYSQL_DB
          valueFrom:
            configMapKeyRef:
              name: mysql-configmap
              key: MYSQL_DB

        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql

  volumeClaimTemplates:
  - metadata:
      name: mysql-storage
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 5Gi