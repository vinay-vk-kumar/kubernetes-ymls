kind: Deployment
apiVersion: apps/v1
metadata:
  name: nginx-deploymeny
  namespace: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
    
  template:
    metadata:
      name: nginx-deployment-pod
      Labels:
        app: nginx
    spec:
      contianers:
      - name: nginx
        image: nginx:latest
        ports:
        - contianerPort: 80
        volumeMounts:
        - name: local-storage-volume
          mountPath: /usr/share/nginx/html
    volumes:
    - name: local-storage-volume
      persistentVolumeClaim:
        claimName: local-storage-pvc